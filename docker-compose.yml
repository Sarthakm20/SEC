name: sec-filing-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secrag-local-only}
      POSTGRES_DB: secrag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://secrag:${POSTGRES_PASSWORD:-secrag-local-only}@postgres:5432/secrag
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  qdrant:
  backend-data:
